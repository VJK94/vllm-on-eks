# GPU capacity, provisioned on demand and protected from everything else.
#
# THE TAINT IS THE POINT: a g4dn.xlarge costs ~8x a t3.medium, so nothing
# lands here unless it explicitly tolerates the taint AND requests a GPU.
# Remember the direction rule — a toleration only PERMITS; what actually
# attracts a pod here is asking for nvidia.com/gpu.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload: inference
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu

      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      requirements:
        # Spot FIRST (Karpenter always prefers the cheapest offering), with
        # on-demand as the floor. GPU spot pools run dry for hours at a time —
        # during this build, 6 instance types x 4 AZs were ALL unfulfillable
        # for the better part of an hour. Spot-only is not a serving strategy;
        # spot-preferred with an on-demand fallback is.
        # NOTE: spot and on-demand are SEPARATE vCPU quotas. Both must be
        # raised (L-3819A6DF and L-DB2E81BA) or the fallback silently fails.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # DIVERSIFY. Spot capacity is per-pool (instance type x AZ x capacity
        # type). Pinning one type in one capacity type across two AZs is TWO
        # pools, and GPU pools run dry constantly — that combination produced
        # UnfulfillableCapacity from CreateFleet for 10 straight minutes.
        # Every type below has exactly ONE GPU and >=16 GiB VRAM, so the
        # workload is identical; Karpenter picks the cheapest one available.
        #   g4dn = T4 16 GiB  (~$0.33/hr spot)
        #   g5   = A10G 24 GiB (~$0.55)   g6 = L4 24 GiB (~$0.58)
        # The 24 GiB cards are a bonus: more VRAM left over for KV cache, and
        # compute capability 8.6+ unlocks FlashAttention-2 and bfloat16.
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge
            - g4dn.2xlarge
            - g5.xlarge
            - g5.2xlarge
            - g6.xlarge
            - g6.2xlarge
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

      # A GPU node takes 5-10 minutes to become useful (image pull + weight
      # load), so do not recycle it casually.
      expireAfter: 168h

  limits:
    # HARD ceiling, and it matches the default G-family spot quota of 8 vCPU
    # = exactly two g4dn.xlarge. Raise the AWS quota before raising this.
    cpu: 8
    nvidia.com/gpu: 2

  disruption:
    # WhenEmpty, not WhenEmptyOrUnderutilized: consolidating a GPU node means
    # evicting a pod that needs 5-10 minutes to come back somewhere else.
    # Underutilized is normal for inference; empty is the only safe signal.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
