# Tells Prometheus to scrape DCGM exporter — the SILICON layer.
#
# This is the fix for the nvidia-smi lie: GPU-Util only means "a kernel was
# running", not "the GPU was used". DCGM gives SM activity, tensor-core
# activity and memory-bandwidth activity, which is what actually
# distinguishes "memory-bound" from "starved".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [gpu-operator]
  selector:
    # These must match the Service's ACTUAL labels — verify, do not guess:
    #   kubectl get svc -n gpu-operator --show-labels
    # A wrong selector fails silently: the ServiceMonitor exists, Prometheus
    # simply never scrapes anything, and the panels stay empty.
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  endpoints:
    - port: metrics # the Service's port NAME, not its number
      interval: 15s
